[package]
name = "sushi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Sushi — a polyphonic software synthesizer"
repository = "https://github.com/77-223255/sushi"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "sushi"
path = "src/main.rs"

[dependencies]
nice-plug = { version = "0.4.2", features = ["standalone"] }
nice-plug-egui = "0.6.0"
egui = { version = "0.37.0", features = ["default_fonts"] }
rtrb = "0.4.0"
serde_json = "1"

# A little optimization in dev builds so the synth is playable without --release.
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
